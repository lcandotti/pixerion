spring.application.name=pixerion-server

# --- Persistence (PostgreSQL; override via env in docker-compose / deployment) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pixerion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pixerion}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pixerion}
# Flyway owns the schema; Hibernate only validates the entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Auth (ADR-0008) ---
# JWT signing secret. MUST be overridden in production; >= 32 bytes for HS256.
app.security.jwt.secret=${APP_JWT_SECRET:dev-secret-change-me-please-0123456789-abcdef}
app.security.jwt.ttl-seconds=${APP_JWT_TTL_SECONDS:3600}
# Initial admin, seeded on first start if absent. Override in production!
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin}

# Keep the health endpoint available for the container healthcheck.
management.endpoints.web.exposure.include=health

# --- API docs (ADR-0012) ---
# Deterministic key ordering so the generated spec diffs stably. Spec serves at
# /v3/api-docs, Scalar UI at /scalar (defaults). Kill switches if docs must be
# hidden in a deployment: springdoc.api-docs.enabled=false / scalar.enabled=false.
springdoc.writer-with-order-by-keys=true
