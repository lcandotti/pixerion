# Test profile: run the full context (security + JPA + seeding) against an in-memory
# H2 database so auth tests need no live Postgres. Flyway is disabled here because its
# migrations target Postgres; Hibernate creates the schema for the H2 test run instead.
# A per-context random DB name keeps each @SpringBootTest context isolated, so one
# context's create-drop can't wipe another's seeded data.
spring.datasource.url=jdbc:h2:mem:pixerion-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.security.jwt.secret=test-secret-test-secret-test-secret-0123456789
app.security.jwt.ttl-seconds=3600
app.admin.username=admin
app.admin.password=admin

management.endpoints.web.exposure.include=health
