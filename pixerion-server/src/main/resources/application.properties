spring.application.name=pixerion-server

pixerion.datasource.host=localhost
pixerion.datasource.port=5432
pixerion.security.jwt.secret=${APP_JWT_SECRET:__unsecure__+$pixerion-8b5a82bd029ae4ed205f8c25479af76541d8a35ffee72f0a6a7e41dd03006a87}
# Access-token lifetime. Short by design: these tokens are self-contained and cannot be
# revoked before they expire, so the window is the only lever.
pixerion.security.jwt.ttl=${APP_JWT_TTL:15m}

# --- Persistence (PostgreSQL; override via env in docker-compose / deployment) ---
# Host/port are split out so pointing at a container whose 5432 is published on a
# Docker-assigned random port is a one-line edit here. Find the current port with:
#   docker compose port PostgreSQL 5432
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${pixerion.datasource.host}:${pixerion.datasource.port}/pixerion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pixerion}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pixerion}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Schema is owned by the migrations under classpath:db/migration, and ddl-auto=validate
# above then fails loudly at startup if the entities and that schema disagree.
spring.flyway.enabled=true

# Keep the health endpoint available for the container health check.
management.endpoints.web.exposure.include=health
