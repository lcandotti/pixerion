# Test profile: in-memory H2 instead of a live Postgres. A per-context random DB
# name keeps each @SpringBootTest context isolated.
#
# This file SHADOWS src/main/resources/application.properties rather than merging with
# it (Boot loads the first classpath:/application.properties it finds, and test resources
# come first), so anything the app needs must be repeated here.
spring.datasource.url=jdbc:h2:mem:pixerion-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Run the real migrations and then verify the entities against what they produced. The
# alternative — ddl-auto=create-drop with Flyway off — derives the schema from the
# entities, which means the migrations are never exercised and can rot unnoticed.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

pixerion.security.jwt.secret=test-secret-that-is-comfortably-over-32-bytes-long
pixerion.security.jwt.ttl=5m

# `info` is exposed on top of `health` purely so there is an endpoint behind the
# hasRole("ADMIN") rule for SecurityRulesTest to push against.
management.endpoints.web.exposure.include=health,info
