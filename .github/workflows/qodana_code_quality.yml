name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis

      # JaCoCo coverage must exist before the scan: Qodana doesn't run tests, it only
      # reads the reports (staged into .qodana/code-coverage by qodana.yaml's bootstrap).
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test (produces JaCoCo coverage XML)
        run: ./gradlew test

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: true  # fresh code: on PRs, gate on newly changed code
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1039269105 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'